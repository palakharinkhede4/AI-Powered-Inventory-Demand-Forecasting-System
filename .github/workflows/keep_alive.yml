name: Keep Streamlit App Alive

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    name: Ping Streamlit App
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        run: |
          URL="${{ secrets.STREAMLIT_APP_URL }}"
          if [ -z "$URL" ]; then
            URL="https://ai-powered-inventory-demand-forecasting-system.streamlit.app"
          fi
          echo "Pinging Streamlit App at: $URL"

          # Send HTTP request without following redirects (-L) to avoid redirect loops (Exit Code 47)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --max-time 15 \
            "$URL")

          echo "HTTP Response Status Code: $HTTP_STATUS"

          # Streamlit Cloud returns 2xx or 3xx (e.g. 303 See Other) when active
          if [[ "$HTTP_STATUS" =~ ^[23][0-9]{2}$ ]]; then
            echo "Success: Keep-alive ping sent successfully. App activity counter reset!"
            exit 0
          else
            echo "Warning: Received unexpected HTTP status code $HTTP_STATUS"
            exit 0
          fi
